name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.TAVI_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TAVI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TAVI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TAVI_KEY_PASSWORD }}
        run: |
          missing=()
          [ -z "$KEYSTORE_B64" ] && missing+=(TAVI_KEYSTORE_BASE64)
          [ -z "$KEYSTORE_PASSWORD" ] && missing+=(TAVI_KEYSTORE_PASSWORD)
          [ -z "$KEY_ALIAS" ] && missing+=(TAVI_KEY_ALIAS)
          [ -z "$KEY_PASSWORD" ] && missing+=(TAVI_KEY_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub secrets for signing: ${missing[*]}"
            exit 1
          fi

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.TAVI_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tavi.jks"

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean --no-install

      - name: Install dependencies (post-prebuild)
        run: npm ci

      - name: Build APK
        env:
          STROP_KEYSTORE_PATH: ${{ runner.temp }}/tavi.jks
          STROP_KEYSTORE_PASSWORD: ${{ secrets.TAVI_KEYSTORE_PASSWORD }}
          STROP_KEY_ALIAS: ${{ secrets.TAVI_KEY_ALIAS }}
          STROP_KEY_PASSWORD: ${{ secrets.TAVI_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: strop-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
